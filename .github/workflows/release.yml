name: Release

# Builds the editor on Ubuntu 24.04 (GTK 4.14, libadwaita 1.5, glibc 2.39), so one download runs on
# every distribution with GNOME 46 or newer: Ubuntu 24.04+, Debian 13, Fedora 40+, Arch and so on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin zip
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/checkout@v5
      - name: Test
        run: cd editor && cargo test --release --locked
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: shotput-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Shotput for Linux ${GITHUB_REF_NAME#v}" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Refresh the website's download mirror
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; fi
