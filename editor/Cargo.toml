[package]
name = "shotput"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Screenshots for pasting: the Shotput editor for Linux (GTK 4)"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true
panic = "abort"
